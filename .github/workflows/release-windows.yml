name: Build & Release Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 (MSVC + Installer)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Python Dependencies (jinja2 for GLAD)
        run: python -m pip install --upgrade pip jinja2

      - name: Configure CMake
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DVANGUARD_BUILD_TESTS=ON
          -DSDL_SHARED=OFF
          -DSDL_STATIC=ON

      - name: Build VanguardGame.exe & Tests
        run: cmake --build build --config Release --parallel

      - name: Run Unit & Determinism Tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage Game Files & Portable Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/VanguardEngine
          Copy-Item build/Release/VanguardGame.exe -Destination dist/VanguardEngine/
          Copy-Item -Recurse assets -Destination dist/VanguardEngine/
          Compress-Archive -Path dist/VanguardEngine/* -DestinationPath VanguardEngine-Windows-x64.zip

      - name: Build Windows Setup Installer (.exe)
        shell: pwsh
        run: |
          if (!(Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & "$iscc" /Q installer.iss

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VanguardEngine-Windows-Release
          path: |
            VanguardEngine-Setup-x64.exe
            VanguardEngine-Windows-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            VanguardEngine-Setup-x64.exe
            VanguardEngine-Windows-x64.zip
          generate_release_notes: true
